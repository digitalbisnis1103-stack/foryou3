
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #000;
    font-family: 'Montserrat', sans-serif;
}

/* PAGE */

.page {
    position: absolute;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: none;
}

.page.active {
    display: flex;
}

/* LOADING / ENVELOPE */

#loading {
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: radial-gradient(circle at center, #2b1020, #000);
    color: white;
    z-index: 100;
}

.envelope-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
}

.envelope {
    width: 260px;
    max-width: 75vw;
    cursor: pointer;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 25px rgba(255,120,200,.4));
    transition: transform .7s ease, opacity .7s ease;
}

.envelope:hover {
    transform: scale(1.08);
}

.envelope-text {
    margin-top: 20px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    text-align: center;
    color: white;
    letter-spacing: 2px;
    text-shadow: 0 0 15px rgba(255,120,200,.8);
    animation: textGlow 2s infinite alternate;
}

/* MUSIC BUTTON */

.music-button {
    position: fixed;
    right: 18px;
    bottom: 20px;
    z-index: 200;
    display: none;
    width: 45px;
    height: 45px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 50%;
    background: rgba(255,105,180,.2);
    color: white;
    font-size: 20px;
    cursor: pointer;
    backdrop-filter: blur(10px);
}

.music-button.show {
    display: block;
}

.music-button.playing {
    animation: musicSpin 4s linear infinite;
}

/* MAIN */

#main {
    justify-content: center;
    align-items: center;
    background: #050505;
    overflow: hidden;
    position: relative;
}

.glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: min(500px, 100vw);
    height: min(500px, 100vw);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,105,180,.22), transparent 70%);
    filter: blur(60px);
    animation: pulse 4s infinite;
    pointer-events: none;
}

.words {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 2;
    overflow: hidden;
    pointer-events: none;
}

.word {
    position: absolute;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: rgba(255,255,255,.35);
    white-space: nowrap;
    pointer-events: none;
    animation: moveWord linear forwards;
}

/* PHOTO */

.photo {
    position: absolute;
    width: 120px;
    height: 150px;
    object-fit: cover;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 0 25px rgba(255,255,255,.12);
    pointer-events: none;
    animation: movePhoto linear forwards;
    z-index: 3;
}

/* CENTER */

.center {
    position: relative;
    z-index: 10;
    text-align: center;
    color: white;
    padding: 20px;
    pointer-events: none;
}

.center h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(38px, 7vw, 72px);
    font-weight: 600;
    letter-spacing: 4px;
    text-shadow: 0 0 15px rgba(255,180,220,.8),
                 0 0 40px rgba(255,120,200,.5);
    animation: titleGlow 3s ease-in-out infinite;
}

.center p {
    margin-top: 15px;
    letter-spacing: 3px;
    font-size: 12px;
    line-height: 1.8;
    text-transform: uppercase;
    opacity: .8;
}

/* HEART */

.heart {
    position: fixed;
    bottom: -50px;
    pointer-events: none;
    animation: heartFloat linear forwards;
    z-index: 20;
}

/* ANIMATIONS */

@keyframes moveWord {
    0% {
        opacity: 0;
        transform: translate(0,0) scale(.8);
    }

    20% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translate(
            calc(var(--moveX) * 1px),
            calc(var(--moveY) * 1px)
        ) scale(1.2);
    }
}

@keyframes movePhoto {
    0% {
        opacity: 0;
        transform: translate(0,0) scale(.8) rotate(-5deg);
    }

    20% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translate(
            calc(var(--moveX) * 1px),
            calc(var(--moveY) * 1px)
        ) scale(1.1) rotate(5deg);
    }
}

@keyframes heartFloat {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: translateY(-115vh) rotate(35deg);
        opacity: 0;
    }
}

@keyframes pulse {
    0%, 100% {
        transform: translate(-50%,-50%) scale(1);
    }

    50% {
        transform: translate(-50%,-50%) scale(1.15);
    }
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}

@keyframes textGlow {
    from {
        text-shadow: 0 0 10px rgba(255,120,200,.4);
    }

    to {
        text-shadow: 0 0 25px rgba(255,120,200,.9);
    }
}

@keyframes titleGlow {
    0%, 100% {
        text-shadow: 0 0 15px rgba(255,180,220,.7),
                     0 0 35px rgba(255,120,200,.4);
    }

    50% {
        text-shadow: 0 0 25px rgba(255,180,220,1),
                     0 0 60px rgba(255,120,200,.7);
    }
}

@keyframes musicSpin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* MOBILE */

@media (max-width: 768px) {
    .envelope {
        width: 210px;
    }

    .envelope-text {
        font-size: 24px;
    }

    .photo {
        width: 90px;
        height: 120px;
        border-radius: 14px;
    }

    .center h1 {
        letter-spacing: 2px;
    }

    .center p {
        font-size: 10px;
        letter-spacing: 2px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .envelope,
    .envelope-text {
        animation-duration: 6s;
    }
}
</style>
</head>

<body>

<!-- PAGE 1: ENVELOPE -->

<div class="page active" id="loading">
    <div class="envelope-wrapper">

        <img
            src="amplop.gif"
            class="envelope"
            id="envelope"
            alt="Amplop cinta"
            onclick="openLetter()"
        >

        <p class="envelope-text">
            something for you... 💗
        </p>

    </div>
</div>

<!-- PAGE 2: MAIN -->

<div class="page" id="main">

    <div class="glow"></div>

    <div class="words" id="words"></div>

    <div class="center">
        <h1>I LOVE YOU ❤️</h1>

        <p>be healthy my favorite person, rayhan🤍</p>
    </div>

</div>

<!-- MUSIC -->

<audio id="music" loop preload="auto" autoplay>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- MUSIC CONTROL -->

<button
    class="music-button"
    id="musicButton"
    onclick="toggleMusic()"
    aria-label="Putar atau jeda musik"
>
    ♪
</button>

<script>

/* =========================
   MUSIC AUTOPLAY
========================= */

const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

music.volume = 0.8;

function updateMusicButton() {
    musicButton.classList.toggle("playing", !music.paused);
    musicButton.innerHTML = music.paused ? "♪" : "♫";
}

function tryAutoplay() {
    music.play()
        .then(() => {
            updateMusicButton();
        })
        .catch(() => {
            // Browser mungkin memblokir autoplay.
            // Musik akan dicoba kembali saat pengguna berinteraksi.
            updateMusicButton();
        });
}

// Coba autoplay saat halaman dimuat.
window.addEventListener("load", () => {
    tryAutoplay();
});

// Coba kembali saat pengguna melakukan interaksi pertama.
function startMusicFromInteraction() {
    if (music.paused) {
        music.play()
            .then(updateMusicButton)
            .catch(updateMusicButton);
    }

    document.removeEventListener("click", startMusicFromInteraction);
    document.removeEventListener("touchstart", startMusicFromInteraction);
}

document.addEventListener("click", startMusicFromInteraction);
document.addEventListener("touchstart", startMusicFromInteraction, {
    passive: true
});

music.addEventListener("play", updateMusicButton);
music.addEventListener("pause", updateMusicButton);

function toggleMusic() {
    if (music.paused) {
        music.play()
            .then(updateMusicButton)
            .catch(error => {
                console.log("Musik gagal diputar:", error);
            });
    } else {
        music.pause();
        updateMusicButton();
    }
}

/* =========================
   OPEN LETTER
========================= */

let letterOpened = false;

function openLetter() {
    if (letterOpened) return;
    letterOpened = true;

    const envelope = document.getElementById("envelope");
    const loading = document.getElementById("loading");
    const main = document.getElementById("main");

    // Mulai musik langsung dari interaksi klik.
    music.play()
        .then(updateMusicButton)
        .catch(error => {
            console.log("Musik belum dapat diputar:", error);
        });

    envelope.style.transform = "scale(1.3)";
    envelope.style.opacity = "0";

    setTimeout(() => {
        loading.classList.remove("active");
        main.classList.add("active");
        musicButton.classList.add("show");

        // Munculkan efek setelah halaman utama dibuka.
        startEffects();
    }, 700);
}

/* =========================
   ROMANTIC WORDS
========================= */

const texts = [
    "you mean everything",
    "only you",
    "stay with me",
    "my safe place",
    "always on my mind",
    "thinking of you",
    "forever",
    "i love you",
    "love u more",
    "my favorite person",
    "my happiness",
    "my home",
    "my comfort",
    "my sunshine",
    "my universe",
    "my heart",
    "my favorite soul",
    "you are enough",
    "you are loved",
    "you are special",
    "you are my person",
    "you make me smile",
    "you make life beautiful",
    "you make everything better",
    "i adore you",
    "i cherish you",
    "i choose you",
    "i'm proud of you",
    "thank you for existing",
    "thank you for staying",
    "thank you for being you",
    "forever starts with you",
    "all roads lead to you",
    "you're my favorite hello",
    "the best part of my day",
    "the best thing that happened to me",
    "every version of you",
    "every moment with you",
    "every memory with you",
    "you're my safe place",
    "you're my peace",
    "you're my happiness",
    "born to be loved",
    "you deserve the world",
    "you deserve happiness",
    "may all your dreams come true",
    "may happiness find you",
    "may love always find you",
    "i'll always choose you",
    "i'll always be here",
    "i'll always support you",
    "my today",
    "my tomorrow",
    "my forever",
    "the one i pray for",
    "the one i adore",
    "the one i love",
    "you're my favorite story",
    "you're my favorite chapter",
    "love you endlessly",
    "love you forever",
    "love you more every day",
    "always and forever",
    "you and me",
    "endless love",
    "my beautiful person",
    "my precious soul",
    "rayhan arriannur",
    "my lucky star"
];

let wordInterval = null;
let photoInterval = null;
let heartInterval = null;

function createWord() {
    const container = document.getElementById("words");
    if (!container || !document.getElementById("main").classList.contains("active")) {
        return;
    }

    const word = document.createElement("div");
    word.className = "word";

    word.innerText = texts[
        Math.floor(Math.random() * texts.length)
    ];

    word.style.left = Math.random() * 85 + "vw";
    word.style.top = Math.random() * 85 + "vh";
    word.style.fontSize = (16 + Math.random() * 20) + "px";

    word.style.setProperty(
        "--moveX",
        Math.random() * 400 - 200
    );

    word.style.setProperty(
        "--moveY",
        Math.random() * 400 - 200
    );

    const duration = 8 + Math.random() * 5;
    word.style.animationDuration = duration + "s";

    container.appendChild(word);

    setTimeout(() => word.remove(), duration * 1000 + 500);
}

/* =========================
   FLOATING PHOTOS
========================= */

const photos = [
    "foto1.jpg",
    "foto2.jpg",
    "foto3.jpg",
    "foto4.jpg"
];

function createPhoto() {
    const main = document.getElementById("main");

    if (!main.classList.contains("active")) return;

    const photo = document.createElement("img");
    photo.className = "photo";

    photo.src = photos[
        Math.floor(Math.random() * photos.length)
    ];

    photo.alt = "Our memory";

    photo.onerror = function() {
        this.remove();
    };

    photo.style.left = Math.random() * 75 + "vw";
    photo.style.top = Math.random() * 70 + "vh";

    photo.style.setProperty(
        "--moveX",
        Math.random() * 500 - 250
    );

    photo.style.setProperty(
        "--moveY",
        Math.random() * 500 - 250
    );

    const duration = 10 + Math.random() * 5;
    photo.style.animationDuration = duration + "s";

    main.appendChild(photo);

    setTimeout(() => photo.remove(), duration * 1000 + 500);
}

/* =========================
   FLOATING HEARTS
========================= */

const hearts = [
    "💗",
    "💕",
    "💖",
    "🎀",
    "🌸",
    "❤️",
    "💘"
];

function createHeart() {
    if (!document.getElementById("main").classList.contains("active")) {
        return;
    }

    const heart = document.createElement("div");
    heart.className = "heart";

    heart.innerHTML = hearts[
        Math.floor(Math.random() * hearts.length)
    ];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 25) + "px";

    const duration = 5 + Math.random() * 4;
    heart.style.animationDuration = duration + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), duration * 1000 + 500);
}

/* =========================
   START EFFECTS
========================= */

function startEffects() {
    if (wordInterval || photoInterval || heartInterval) return;

    // Efek teks romantis bergerak.
    for (let i = 0; i < 8; i++) {
        setTimeout(createWord, i * 250);
    }

    wordInterval = setInterval(createWord, 700);

    // Foto bergerak.
    for (let i = 0; i < 3; i++) {
        setTimeout(createPhoto, i * 500);
    }

    photoInterval = setInterval(createPhoto, 1800);

    // Hati melayang.
    for (let i = 0; i < 5; i++) {
        setTimeout(createHeart, i * 200);
    }

    heartInterval = setInterval(createHeart, 500);
}

/* =========================
   ERROR HANDLING
========================= */

music.addEventListener("error", () => {
    console.log(
        "File musik tidak ditemukan. Pastikan music.mp3 berada di folder yang sama dengan index.html."
    );
});

</script>

</body>
</html>
